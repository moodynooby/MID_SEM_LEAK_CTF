services:
  ctfd:
    image: ctfd/ctfd:3.7.0
    container_name: ctfd_app
    user: ctfd
    restart: unless-stopped
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://${MYSQL_USER:-ctfd}:${MYSQL_PASSWORD:-ctfd_secure_pass}@db/${MYSQL_DATABASE:-ctfd}
      - REDIS_URL=redis://cache:6379
      - SECRET_KEY=${SECRET_KEY:-change_me_to_a_random_secret_key_32_bytes}
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=/var/log/CTFd/access.log
      - ERROR_LOG=/var/log/CTFd/error.log
      - REVERSE_PROXY=true
      - WORKERS=${CTFD_WORKERS:-4}
    volumes:
      - ctfd_data:/var/uploads
      - ctfd_logs:/var/log/CTFd
      - ./themes/m0xblood:/opt/CTFd/CTFd/themes/m0xblood:ro
    networks:
      - internal_net
      - proxy_net
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started

  nginx:
    image: nginx:alpine
    container_name: ctfd_proxy
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./conf/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ctfd_data:/var/uploads:ro
      - ./av-console:/usr/share/nginx/av-console:ro
      - ./tools/spin_wheel:/usr/share/nginx/spin-wheel:ro
    networks:
      - proxy_net
    depends_on:
      - ctfd
      - anubis

  anubis:
    image: ghcr.io/techarohq/anubis@sha256:5fcbce70ee6168be5b226d19bec90111d0acd0daf13028fa06b044cf3ebbbd5f
    container_name: ctfd_anubis
    restart: unless-stopped
    environment:
      - BIND=:8080
      - TARGET=http://ctfd:8000
      - DIFFICULTY=3
      - SERVE_ROBOTS_TXT=true
      - POLICY_FNAME=/data/cfg/botPolicy.yaml
      - OG_PASSTHROUGH=true
      # LAN runs plain HTTP on port 80. Anubis v1.28+ defaults to
      # COOKIE_SECURE=true / COOKIE_PARTITIONED=true, and browsers silently
      # DROP `Secure` (and `Partitioned`, which mandates Secure) cookies that
      # arrive over http://. That killed the verification cookie and looped
      # every participant on "user has cookies disabled" (only http://localhost
      # worked, since localhost is a trusted origin). SameSite None also
      # auto-downgrades to Lax once COOKIE_SECURE=false.
      - COOKIE_SECURE=false
      - COOKIE_PARTITIONED=false
    volumes:
      - ./conf/anubis/botPolicy.yaml:/data/cfg/botPolicy.yaml:ro
    networks:
      - proxy_net
    depends_on:
      - ctfd

  db:
    image: mariadb:10.11
    container_name: ctfd_db
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root_super_secret_db_pass}
      - MYSQL_USER=${MYSQL_USER:-ctfd}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-ctfd_secure_pass}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-ctfd}
    volumes:
      - db_data:/var/lib/mysql
      - ./conf/mysql/my.cnf:/etc/mysql/conf.d/custom.cnf:ro
    networks:
      - internal_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    container_name: ctfd_cache
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - internal_net

  challenge_cookie_api:
    build: ./challenges/cookie_api
    container_name: challenge_cookie_api
    restart: unless-stopped
    ports:
      - "5001:5001"
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5001/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  challenge_proctor_bot:
    build: ./challenges/ai_prompt_injection
    container_name: challenge_proctor_bot
    restart: unless-stopped
    ports:
      - "5002:5002"
    # Ollama runs on the host, bound to the docker0 bridge (172.17.0.1:11434).
    # host-gateway resolves host.docker.internal to that bridge IP on Linux too,
    # so the bot no longer needs host networking (which broke macOS/Windows and
    # gave the service a 5-deep listen backlog).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - OLLAMA_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=smollm2
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5002/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

  challenge_php2shell:
    build: ./challenges/php2shell
    container_name: challenge_php2shell
    restart: unless-stopped
    ports:
      - "5003:5003"
    networks:
      - proxy_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:5003/', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3

networks:
  internal_net:
    internal: true
  proxy_net:
    driver: bridge

volumes:
  ctfd_data:
  ctfd_logs:
  db_data:
  redis_data:
