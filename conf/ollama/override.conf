# Host-side Ollama bind for the AI Proctor Bot challenge (5002).
#
# The proctor bot runs as a normal bridge container on `proxy_net`. Loopback
# inside a bridge network is the container itself, so the container reaches the
# host through the docker0 gateway (host.docker.internal -> host-gateway).
# Ollama must therefore listen on the bridge address, NOT on 127.0.0.1.
#
# Install (Linux, systemd):
#   sudo mkdir -p /etc/systemd/system/ollama.service.d
#   sudo cp conf/ollama/override.conf /etc/systemd/system/ollama.service.d/override.conf
#   sudo systemctl daemon-reload && sudo systemctl restart ollama
#
# Verify:
#   ss -ltnp | grep 11434          # must show 172.17.0.1:11434 (not 127.0.0.1)
#   uv run ctf status              # "[+] Ollama reachable from containers"
#
# 172.17.0.1 is the default docker0 bridge gateway. It is reachable from the
# host and from bridge containers, but not routable from the LAN, so this does
# not expose the model to participants. If `docker network inspect bridge`
# reports a different gateway, update this value to match.
[Service]
Environment="OLLAMA_HOST=172.17.0.1:11434"
