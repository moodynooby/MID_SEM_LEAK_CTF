# =================================================================
# Nginx Reverse Proxy Configuration for CTFd
# IEEE AUSB: Case File: The Mid-Sem Leak
# =================================================================

upstream ctfd_backend {
    server ctfd:8000;
    keepalive 32;
}

upstream anubis_backend {
    server anubis:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Maximum upload size for challenge attachments (pcap, memory dump, disk images)
    client_max_body_size 100M;

    # Timeouts
    client_body_timeout 60s;
    client_header_timeout 60s;
    keepalive_timeout 65s;
    send_timeout 60s;

    # Gzip Compression for rapid asset loading on lab Wi-Fi/LAN
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Directly serve static uploaded challenge files if mounted (trailing slash prevents alias traversal)
    location /files/ {
        alias /var/uploads/;
        expires 1h;
        add_header Cache-Control "public, no-transform";
    }

    # Big-screen AV console & Live Ops Cockpit (see av-console/README.md).
    # Pure static files, no cache so edits show up on reload without a container restart.
    location /av-console/ {
        alias /usr/share/nginx/av-console/;
        add_header Cache-Control "no-cache";
    }

    # Live Ops Host Runner API (Issue #25 & Cockpit CLI-to-UI)
    location /api/ops/ {
        proxy_pass http://host.docker.internal:8088/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Real-Time Scoreboard Events (SSE / WebSockets)
    # CTFd uses /events for live scoreboard updates and alerts — buffering MUST be off!
    location /events {
        proxy_pass http://ctfd_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 24h;
    }

    # Standard CTFd Application Routes (protected by Anubis Proof-of-Work against AI scrapers)
    location / {
        proxy_pass http://anubis_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
