name: "Docket #102: The Fictional Exam Portal Breach"
author: "Content Team"
category: "Web / Forensics (Dual Route)"
description: |
  **Case File Briefing:**
  The fictional mid-sem paper was stored behind the internal faculty portal (`portal.internal.exam`).
  At 21:14 PM, anomalous traffic hit the authentication gateway.
  
  **Dual Route Investigation:**
  Your team can solve this clue through either of two routes:
  - **Route A (Log Analysis):** Sift through the raw web server access logs `portal_access.log` to identify the malicious payload and SQL injection parameter.
  - **Route B (Web Inspection):** Inspect the archived portal source code to find the unauthenticated parameter bypass.

  **Flag Format:** `case{...}`

