hints:
  - content: "Focus on the traffic spikes between 02:00 and 02:30 AM on the Faculty AP (BSSID 00:1a:1e:f0:20:70)."
    cost: 25
  - content: "Correlate the client MAC address connecting at 02:13:42 with the DHCP lease table to resolve the hostname and session sync token."
    cost: 50

