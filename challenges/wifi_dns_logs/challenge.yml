name: "DNS / Wi-Fi Logs: The 2:13 AM Auto-Sync"
author: "Vatsal Pandya (@VP1107)"
category: "Network"
difficulty: "medium"
description: |
  **Case File Briefing:**
  Investigators auditing the AU wireless infrastructure captured overnight connection spools (`campus_wifi_access.log` and `dhcp_leases.log`) from the central Aruba mobility controller and DHCP server.

  Initial forensic theories assumed an outside intruder compromised the lab workstations. However, network telemetry reveals a critical plot twist: at **02:13:42 IST**, an authorized device connected to the faculty wireless access point (`AP-AU-FACULTY-L2`) and synchronized confidential course materials to internal storage, which TA Piyush subsequently hijacked.

  Analyze the wireless access syslog and DHCP lease mappings. Correlate timestamps, MAC addresses, and DNS queries to identify the device and extract the auto-sync verification token flag.

  **Flag Format:** `case{...}`

value: 500
type: dynamic
extra:
  initial: 500
  decay: 16
  minimum: 200

