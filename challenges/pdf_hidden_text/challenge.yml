hints:
  - content: "A visual black box in a PDF is often just a vector rectangle drawn on top of the text. The underlying text operators might still be present in the content stream."
    cost: 25
  - content: "Try extracting all plain text using command line utilities like `pdftotext OOP99_Exam_Paper_REDACTED.pdf -` or `strings`."
    cost: 50

