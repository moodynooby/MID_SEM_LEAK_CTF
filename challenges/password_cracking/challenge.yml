name: "Password Cracking: Faculty Vault & Campus Wordlist"
author: "Vidit (@viditd1-eng)"
category: "Crypto"
description: |
  **Case File Briefing:**
  A secure zip archive named `confidential_vault.zip` was discovered staged on the faculty shared network drive. According to system access timestamps, the archive was encrypted and transferred just minutes before the network alert triggered.

  Investigators believe this archive contains Prof. Hasmukh Chelaiya's master examination draft and grading key for **OOP 99**. However, the archive is protected by a strong passphrase.

  Standard wordlists like `rockyou.txt` will fail completely. Campus Security interviews reveal that the culprit (TA Piyush Pelaiya) constructed the vault password using department identifiers:
  - The crime scene laboratory: `AU207`
  - The aggrieved course where Piyush was graded harshly: `OS101`
  - The suspect's first name: `Piyush`
  - The current competition year with special character punctuation: `2026!`

  Components are concatenated with underscores (e.g., `[Lab]_[Course]_[Suspect][Year]!`).

  Generate a targeted dictionary or use Hashcat/John mask attack to crack the archive hash and extract the confidential vault flag!

  **Flag Format:** `case{...}`

value: 500
type: dynamic
extra:
  initial: 500
  decay: 15
  minimum: 100

flags:
  - case{custom_hashcat_wordlist_cracked_vault}

tags:
  - crypto
  - hashcat
