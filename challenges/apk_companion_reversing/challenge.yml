name: "APK Reverse Engineer: Suspect's Companion App"
author: "Vidit (@viditd1-eng)"
category: "Reversing"
description: |
  **Case File Briefing:**
  During forensic triage of a smartphone recovered from the GICT Lab 207 terminal desk, investigators identified a custom sideloaded Android application (`GICT_Companion.apk`).

  According to campus network records, this companion app was used by TA Piyush Pelaiya to maintain an authenticated administrative bridge to the department grading portal. The app includes a security verification module that validates faculty session tokens and generates a cryptographic handshake key.

  Your mission: Decompile the Android application package, inspect the authentication and security controllers, deobfuscate the dynamic token synthesis algorithm, and extract the master key flag!

  **Flag Format:** `case{...}`

